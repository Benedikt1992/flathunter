# Agent · Queue
# Trigger: an issue is closed (may unblock others), an agent PR is merged or closed
#          (frees a work-in-progress slot), or manually.
# Result:  starts waiting/queued `agent:ready` issues whose "Blockiert durch" issues are all
#          closed, lowest issue number first (= roadmap order), up to AGENT_MAX_PARALLEL
#          active tasks. No model runs here; agent-implement.yml re-checks everything.
name: "Agent · Queue"

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: agent-queue
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  next:
    if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MAINTAINER: ${{ vars.AGENT_MAINTAINER || github.repository_owner }}
      MAX_PARALLEL: ${{ vars.AGENT_MAX_PARALLEL || '2' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Clean up labels of the finished issue
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          issue="${BRANCH#agent/issue-}"
          gh issue edit "$issue" --remove-label agent:in-progress || true
          if [ "$MERGED" != "true" ]; then
            gh issue comment "$issue" --body "Agent PR was closed without merging. Re-add \`agent:ready\` to start over (delete branch \`$BRANCH\` first)."
          fi

      - name: Find startable issues
        id: next
        run: python3 .github/scripts/agent_ops.py next-startable --max-parallel "$MAX_PARALLEL"

      - name: Start them
        if: steps.next.outputs.issues != ''
        env:
          ISSUES: ${{ steps.next.outputs.issues }}
        run: |
          for issue in $ISSUES; do
            # mark as active right away so a parallel queue run does not start it twice
            gh issue edit "$issue" --add-label agent:in-progress --remove-label agent:waiting --remove-label agent:queued
            gh workflow run agent-implement.yml --ref "$DEFAULT_BRANCH" -f issue="$issue"
            echo "started #$issue" >> "$GITHUB_STEP_SUMMARY"
          done
