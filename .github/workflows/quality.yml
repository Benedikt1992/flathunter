# Architecture gate: dependency rules from ARCHITECTURE.md, enforced by import-linter.
name: Quality

on:
  push:
    branches: [main, fork-main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install import-linter
      - name: lint-imports
        run: lint-imports
