# Agent · Feedback router
# Trigger: the maintainer submits a review with "Request changes" on an agent PR.
# Result:  dispatches the fixer in human mode. No model runs here.
name: "Agent · Feedback"

on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  pull-requests: write

jobs:
  route:
    if: >-
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == (vars.AGENT_MAINTAINER || github.repository_owner) &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label agent:in-progress --remove-label needs-human || true
          gh workflow run agent-fix.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" -f pr="$PR" -f mode=human
